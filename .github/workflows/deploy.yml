name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # ─── Lint Frontend ───────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Lint frontend
        run: ./node_modules/.bin/eslint src
        working-directory: apps/frontend

  # ─── Type Check Backend ──────────────────────────────────────────
  lint-backend:
    name: Type Check Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --ignore-scripts
      - name: Prisma generate
        run: npx prisma generate
        working-directory: apps/backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: apps/backend

  # ─── Deploy Frontend to Vercel ───────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Debug pulled env
        run: |
          echo "=== .vercel directory ==="
          ls -la .vercel/ || echo "(no .vercel dir at repo root)"
          ls -la apps/frontend/.vercel/ || echo "(no .vercel dir at apps/frontend)"
          echo "=== env file presence (root) ==="
          if [ -f .vercel/.env.production.local ]; then
            echo "Found at root. Keys present:"
            grep -oE '^[A-Z_]+' .vercel/.env.production.local | sort -u
          fi
          echo "=== env file presence (apps/frontend) ==="
          if [ -f apps/frontend/.vercel/.env.production.local ]; then
            echo "Found at apps/frontend. Keys present:"
            grep -oE '^[A-Z_]+' apps/frontend/.vercel/.env.production.local | sort -u
          fi
      - name: Build
        run: |
          set -a
          [ -f .vercel/.env.production.local ] && source .vercel/.env.production.local
          [ -f apps/frontend/.vercel/.env.production.local ] && source apps/frontend/.vercel/.env.production.local
          : "${DATABASE_URL:=******localhost:5432/dummy}"
          set +a
          echo "DATABASE_URL set: $([ -n "$DATABASE_URL" ] && echo yes || echo NO)"
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ─── Deploy Backend to Render ────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: [lint-backend]
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
